<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumi 桌宠</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      body { user-select: none; -webkit-app-region: drag; cursor: grab; }
      body:active { cursor: grabbing; }
      #pet { display: block; width: 192px; height: 208px; image-rendering: auto; }
      #status { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); padding: 2px 7px; border-radius: 8px; background: rgba(16, 35, 65, .72); color: #fff; font: 10px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; opacity: 0; transition: opacity .2s; pointer-events: none; }
      body:hover #status { opacity: .8; }
    </style>
  </head>
  <body>
    <canvas id="pet" width="192" height="208" aria-label="Lumi 桌宠"></canvas>
    <div id="status"></div>
    <script src="renderer.js"></script>
  </body>
</html>
